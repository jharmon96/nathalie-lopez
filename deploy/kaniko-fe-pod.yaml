apiVersion: v1
kind: Pod
metadata:
  name: kaniko
  namespace: nathalie-lopez
spec:
  restartPolicy: Never
  containers:
    - name: kaniko
      image: gcr.io/kaniko-project/executor:latest
      args:
        - "--dockerfile=Dockerfile"
        - "--context=tar:///data/context.tar.gz"
        - "--destination=extendederp/nathalie-lopez:amd64-v12"
        - "--custom-platform=linux/amd64"
      volumeMounts:
        - name: docker-config
          mountPath: /kaniko/.docker/
        - name: data
          mountPath: /data
      resources:
        requests:
          memory: 1Gi
          cpu: 500m
        limits:
          memory: 4Gi
          cpu: "2"
  nodeSelector:
    kubernetes.io/arch: amd64
  volumes:
    - name: docker-config
      secret:
        secretName: regcred
        items:
          - key: .dockerconfigjson
            path: config.json
    - name: data
      persistentVolumeClaim:
        claimName: nathalie-lopez-data
