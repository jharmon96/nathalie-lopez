# --------------------------- ingress (HTTPS) ---------------------------
# Public portfolio site: security-headers middleware only — deliberately NO
# ip-whitelist, and no /api route: the site is frontend-only.
kind: IngressRoute
apiVersion: traefik.io/v1alpha1
metadata:
  name: {{ .Release.Name }}-route-tls
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nathalie-lopez.labels" . | nindent 4 }}
  annotations:
    external-dns.alpha.kubernetes.io/hostname: {{ .Values.ingress.host }}
    external-dns.alpha.kubernetes.io/target: {{ .Values.global.externalDns.target | quote }}
    external-dns.alpha.kubernetes.io/ttl: {{ .Values.global.externalDns.ttl | quote }}
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`{{ .Values.ingress.host }}`) && PathPrefix(`/api`)
      middlewares:
        - name: p-networking-internal-security@kubernetescrd
      services:
        - name: {{ .Release.Name }}-backend
          port: {{ .Values.backend.service.port }}
    - kind: Rule
      match: Host(`{{ .Values.ingress.host }}`)
      middlewares:
        - name: p-networking-internal-security@kubernetescrd
      services:
        - name: {{ .Release.Name }}-app
          port: {{ .Values.app.service.port }}
  tls:
    secretName: {{ .Values.certificate.secretName }}
---
# --------------------------- ingress (HTTP) ---------------------------
kind: IngressRoute
apiVersion: traefik.io/v1alpha1
metadata:
  name: {{ .Release.Name }}-route
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nathalie-lopez.labels" . | nindent 4 }}
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`{{ .Values.ingress.host }}`)
      middlewares:
        - name: p-networking-http-redirectscheme@kubernetescrd
      services:
        - name: {{ .Release.Name }}-app
          port: {{ .Values.app.service.port }}
