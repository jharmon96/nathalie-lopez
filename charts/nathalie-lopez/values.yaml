global:
  imagePullSecret: regcred
  externalDns:
    # Public VPS that fronts the cluster (outer traefik)
    target: "134.199.245.186"
    ttl: "60"

ingress:
  host: nathalie.lopez.clan.global

certificate:
  clusterIssuer: letsencrypt-prod
  secretName: nathalie-lopez-tls

app:
  image: extendederp/nathalie-lopez
  version: 10
  replicas: 1
  service:
    port: 80
  resources:
    requests:
      memory: 32Mi
      cpu: 25m
    limits:
      memory: 64Mi
      cpu: 100m
  nodeSelector:
    kubernetes.io/arch: amd64

backend:
  image: extendederp/nathalie-lopez-backend
  version: 12
  replicas: 1
  service:
    port: 8000
  # REQUIRED at install time via --set. Never commit values.
  adminPassword: ""
  sessionSecret: ""
  corsOrigins: '["https://nathalie.lopez.clan.global"]'
  # Meta app for the Instagram connection. The App ID is not sensitive; the
  # App Secret lives in a separate k8s secret created outside Helm.
  instagramAppId: "1110954054831809"
  instagramSecretName: nathalie-lopez-instagram
  instagramRedirectUri: "https://nathalie.lopez.clan.global/api/v1/admin/instagram/callback"
  resources:
    requests:
      memory: 64Mi
      cpu: 25m
    limits:
      memory: 256Mi
      cpu: 250m
  nodeSelector:
    kubernetes.io/arch: amd64

persistence:
  storageClass: nfs-client
  size: 1Gi
  mountPath: /data
